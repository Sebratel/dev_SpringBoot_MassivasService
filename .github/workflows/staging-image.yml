name: Imagem de staging

# Constroi a imagem e publica no GHCR a cada push na branch staging. O Portainer so baixa a imagem: o build
# dentro do host passa de 90 s e o proxy do stage derruba a requisicao de deploy.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-staging
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/sebratel/massivas-service

jobs:
  publicar:
    name: Construir e publicar a imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:staging
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Acionar deploy no Portainer (pull + redeploy)
        # So dispara o pull da imagem ja publicada acima; o host nao faz build, por isso nao esbarra no
        # timeout de 90 s do proxy do stage. Sem o secret, a imagem fica publicada e o redeploy segue manual
        # (aviso, nao falha). Mostra o status e o corpo da resposta do Portainer, nunca a URL (ela e segredo).
        env:
          WEBHOOK: ${{ secrets.PORTAINER_MASSIVAS_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::Secret PORTAINER_MASSIVAS_WEBHOOK_URL ausente: imagem publicada, mas o redeploy do Portainer nao foi acionado."
            exit 0
          fi
          codigo=$(curl --silent --show-error --output resposta.txt --write-out '%{http_code}' -X POST "$WEBHOOK")
          echo "Portainer respondeu HTTP $codigo"
          head -c 600 resposta.txt || true
          echo
          case "$codigo" in 2??) ;; *) exit 1 ;; esac
