# Custom properties for tests
elleven.creation-delay=0

# Dummy client-id: Spring Boot 3.5+ valida que registrations OAuth2 configuradas
# tenham client-id nao vazio, mesmo quando o registration nao e exercitado nos testes.
GOOGLE_CLIENT_ID=test-google-client-id

# Sobe o contexto sem abrir conexao com banco: o dialeto vem do application.yml
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none
management.health.db.enabled=false
