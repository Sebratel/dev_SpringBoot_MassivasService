spring:
  application:
    name: massivas-service
  jackson:
    time-zone: America/Sao_Paulo
  mvc:
    async:
      request-timeout: 600000
  datasource:
    afetados:
      url: ${AFETADOS_DB_URL}
      username: ${AFETADOS_DB_USER}
      password: ${AFETADOS_DB_PASS}
      driver-class-name: org.mariadb.jdbc.Driver
    erp:
      url: ${ERP_DB_URL}
      username: ${ERP_DB_USER}
      password: ${ERP_DB_PASS}
      driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8101}
  tomcat:
    connection-timeout: 600000

management:
  endpoints:
    web:
      exposure:
        # prometheus: o servico so aceita chamadas da rede privada (gateway e Prometheus)
        include: health,info,prometheus
  metrics:
    tags:
      application: massivas-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

elleven:
  client-id: ${ELLEVEN_CLIENT_ID:}
  client-secret: ${ELLEVEN_CLIENT_SECRET:}
  syndata: ${ELLEVEN_CLIENT_SYNDATA:}
  grant-type: ${ELLEVEN_CLIENT_GRANT_TYPE:}
  scope: ${ELLEVEN_CLIENT_SCOPE:}

# O API Gateway manda traceparent e X-Request-Id; o CorrelationFilter os poe no log: [traceId,requestId].
logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{requestId:-}]"
