# Stack de STAGING (Portainer, a partir do Git: branch staging). A imagem e construida no GitHub Actions
# (workflow staging-image.yml) e publicada no GHCR; o Portainer so a baixa.
# Rede externa "proxy": a mesma do BFF atual; os serviços se enxergam pelo nome do container.
services:
  massivas-service:
    image: ghcr.io/sebratel/massivas-service:staging
    pull_policy: always
    container_name: massivas-service-stage
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - proxy
    environment:
      - SERVER_PORT=8101
      - APP_ENV=staging
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8101'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  proxy:
    external: true
