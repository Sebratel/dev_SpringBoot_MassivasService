# Stack de STAGING (Portainer, a partir do Git: branch staging). A imagem e construida no GitHub Actions
# (workflow staging-image.yml) e publicada no GHCR; o Portainer so a baixa.
# Rede externa "proxy": a mesma do BFF atual; os serviços se enxergam pelo nome do container.
services:
  massivas-service:
    image: ghcr.io/sebratel/massivas-service:staging
    pull_policy: always
    container_name: massivas-service-stage
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - proxy
    environment:
      - SERVER_PORT=8101
      - APP_ENV=staging
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
      - ERP_DB_URL=${ERP_DB_URL}
      - ERP_DB_USER=${ERP_DB_USER}
      - ERP_DB_PASS=${ERP_DB_PASS}
      - AFETADOS_DB_URL=${AFETADOS_DB_URL}
      - AFETADOS_DB_USER=${AFETADOS_DB_USER}
      - AFETADOS_DB_PASS=${AFETADOS_DB_PASS}
      - ELLEVEN_CLIENT_ID=${ELLEVEN_CLIENT_ID:-}
      - ELLEVEN_CLIENT_SECRET=${ELLEVEN_CLIENT_SECRET:-}
      - ELLEVEN_CLIENT_SYNDATA=${ELLEVEN_CLIENT_SYNDATA:-}
      - ELLEVEN_CLIENT_GRANT_TYPE=${ELLEVEN_CLIENT_GRANT_TYPE:-}
      - ELLEVEN_CLIENT_SCOPE=${ELLEVEN_CLIENT_SCOPE:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8101'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  proxy:
    external: true
